name: Bug report
description: Something in NECTAR does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Do not paste tokens, credentials, private project files, or conversations with confidential content.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project with the Software development template
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NECTAR version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine in use
      options:
        - Claude Code
        - Codex
        - Both
        - Not related to an engine
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - English
        - Português (Brasil)
        - Español
        - Français
        - 中文（简体）
        - 日本語
        - 한국어
        - Русский
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove anything private before attaching.
