name: Feature request
description: Suggest an idea or improvement for NECTAR.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat
        - Board and cards
        - Autopilot
        - Memory
        - Calendar
        - Hive
        - Credits and cost
        - Voice
        - Integrations
        - Team templates
        - Interface language
        - Other
