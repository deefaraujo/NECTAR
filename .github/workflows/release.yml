name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/verificar-publicacao.mjs --head
      - run: npm test
      - name: Build Windows package
        run: npx electron-builder --win --publish never
      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|^\[)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:TAG $zip.FullName --clobber }
          else { gh release create $env:TAG $zip.FullName --title "NECTAR $env:TAG" --notes-file release-notes.md }
